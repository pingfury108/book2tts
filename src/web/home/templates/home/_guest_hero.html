{% load static %}
<div class="max-w-6xl mx-auto px-4 sm:px-6 pt-8 sm:pt-14 pb-2">
  <div class="grid lg:grid-cols-[1.05fr_.95fr] gap-12 items-center">
    <!-- 左：价值主张 + 单一主 CTA（左对齐） -->
    <div>
      <span class="inline-flex items-center gap-2 text-[13px] font-medium text-base-content/60 border border-base-300 bg-base-100 rounded-full px-3.5 py-1.5">
        <span class="w-[7px] h-[7px] rounded-full bg-accent"></span>
        在线 TTS · 有声书 · 播客 RSS
      </span>
      <h1 class="text-4xl sm:text-5xl font-extrabold tracking-tight leading-[1.25] mt-5">
        把你的书，<br />变成<span class="px-1 bg-orange-200/60 dark:bg-orange-400/25 rounded">可以听</span>的书。
      </h1>
      <p class="text-base sm:text-lg leading-loose text-base-content/60 max-w-xl mt-4">
        上传 EPUB 或 PDF，自动分章、多音色朗读，生成属于你的有声书；一键产出播客 RSS，在任意播客 App 里收听。
      </p>
      <div class="flex flex-wrap items-center gap-4 sm:gap-6 mt-7">
        <a href="{% url 'register' %}" class="btn btn-primary rounded-xl px-7 shadow-lg shadow-primary/25">免费开始制作</a>
        <a href="{% url 'explore' %}" class="btn btn-link text-primary font-semibold no-underline hover:underline px-1 gap-2">
          先听听公开作品 <i class="fas fa-arrow-right text-sm"></i>
        </a>
      </div>
      <p class="text-[13px] text-base-content/50 mt-5">免费注册 · 支持中文多音色 · 章节与 SRT 字幕自动生成</p>
    </div>

    <!-- 右：封面拼贴 + 悬浮播放 chip -->
    <div class="hidden lg:block relative h-[420px]">
      <div class="absolute left-6 top-4 w-44 h-60 rounded-2xl bg-gradient-to-br from-violet-500 to-violet-700 shadow-xl -rotate-6 p-4 flex flex-col justify-between text-white">
        <span class="w-5 h-0.5 bg-white/60 rounded"></span>
        <div>
          <p class="text-xl font-bold leading-snug">把一本书</p>
          <p class="text-xl font-bold leading-snug">变成一档节目</p>
          <p class="text-xs opacity-70 mt-2">Book2TTS</p>
        </div>
      </div>
      <div class="absolute left-48 top-10 w-44 h-60 rounded-2xl bg-gradient-to-br from-amber-500 to-amber-700 shadow-xl rotate-3 p-4 flex flex-col justify-between text-white">
        <span class="w-5 h-0.5 bg-white/60 rounded"></span>
        <div>
          <p class="text-xl font-bold leading-snug">多音色朗读</p>
          <p class="text-xl font-bold leading-snug">章节 · 字幕</p>
          <p class="text-xs opacity-70 mt-2">EPUB / PDF / OCR</p>
        </div>
      </div>
      <div class="absolute left-28 top-52 w-48 h-64 rounded-2xl bg-gradient-to-br from-sky-500 to-sky-700 shadow-2xl rotate-2 p-4 flex flex-col justify-between text-white z-10">
        <span class="w-5 h-0.5 bg-white/60 rounded"></span>
        <div>
          <p class="text-xl font-bold leading-snug">播客 RSS 订阅</p>
          <p class="text-xl font-bold leading-snug">随时随地收听</p>
          <p class="text-xs opacity-70 mt-2">Apple Podcasts · 小宇宙</p>
        </div>
      </div>
      <div class="absolute right-0 bottom-6 z-20 bg-base-100 border border-base-300 rounded-2xl shadow-xl px-4 py-3 flex items-center gap-3 -rotate-2">
        <span class="btn btn-circle btn-sm bg-accent hover:bg-accent-focus border-none text-accent-content pointer-events-none shadow-md shadow-accent/30">
          <i class="fas fa-play text-xs ml-0.5"></i>
        </span>
        <div>
          <p class="text-[13px] font-semibold leading-none">第三章 · 江湖纪闻</p>
          <div class="flex items-end gap-[2px] h-4 mt-2" aria-hidden="true">
            <span class="w-[2px] rounded bg-accent" style="height:35%"></span>
            <span class="w-[2px] rounded bg-accent" style="height:70%"></span>
            <span class="w-[2px] rounded bg-accent" style="height:50%"></span>
            <span class="w-[2px] rounded bg-accent" style="height:90%"></span>
            <span class="w-[2px] rounded bg-accent" style="height:60%"></span>
            <span class="w-[2px] rounded bg-base-300" style="height:45%"></span>
            <span class="w-[2px] rounded bg-base-300" style="height:75%"></span>
            <span class="w-[2px] rounded bg-base-300" style="height:40%"></span>
            <span class="w-[2px] rounded bg-base-300" style="height:65%"></span>
            <span class="w-[2px] rounded bg-base-300" style="height:55%"></span>
            <span class="w-[2px] rounded bg-base-300" style="height:80%"></span>
            <span class="w-[2px] rounded bg-base-300" style="height:30%"></span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
