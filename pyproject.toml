[project]
name = "book2tts"
version = "0.1.0"
description = "Book to TTS"
authors = [
    { name = "pingfury", email = "pingfury@outlook.com" }
]
dependencies = [
    "beautifulsoup4>=4.12.3",
    "ebooklib>=0.18",
    "edge-tts>=7.3.1",
    "pymupdf>=1.24.12",
    "volcengine>=1.0.157",
    "django>=6.1",
    "django-tasks-db @ git+https://github.com/RealOrangeOne/django-tasks-db.git@5c7cbd1d015bd6cc6bbc1c7f35ff2cef839d2f13",
    "django-tailwind[reload]>=3.8.0",
    "pip>=24.2",
    "django-htmx>=1.21.0",
    "opendal>=0.46.0",
    "click>=8.1.7",
    "lxml>=5.3.0",
    "azure-cognitiveservices-speech>=1.41.1",
    "ffmpeg-python>=0.2.0",
    "python-dotenv>=1.0.1",
    "feedgen>=1.0.0",
    "gunicorn>=23.0.0",
    "requests>=2.31.0",
    "uvicorn>=0.36.0",
    "uvicorn-worker>=0.3.0",
    "openai>=3.42.1",
    "pillow>=13.0.0",
    "filelock>=4.2.7",
]
readme = "README.md"
requires-python = ">= 3.8"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = [
    "django-stubs>=5.1.1",
]


[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/book2tts", "src/web"]

[tool.pyright]
extraPaths = [".venv/lib/python3.12/"]
